[workspace]
resolver = "3"
members = ["apps/archiv", "crates/core", "crates/platform", "crates/engine", "crates/ui-egui"]
default-members = ["apps/archiv"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "0BSD"

[workspace.dependencies]
archiv-core = { path = "crates/core" }
archiv-platform = { path = "crates/platform" }
archiv-engine = { path = "crates/engine" }
archiv-ui-egui = { path = "crates/ui-egui" }
egui = { version = "0.37", default-features = false, features = ["default_fonts", "serde"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit", "clipboard", "persistence", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false }
serde = { version = "1", features = ["derive"] }
rustix = { version = "1", features = ["fs"] }
tempfile = "3"
serde_json = "1"
egui_kittest = { version = "0.37", default-features = false, features = ["eframe"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Preserve normal error unwinding; do not turn worker failures into process aborts.
[profile.release]
lto = "thin"
