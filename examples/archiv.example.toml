# DESIGN EXAMPLE ONLY: no parser/schema exists yet; not a runnable configuration.
# Paths are illustrative PC mount paths, not verified mount points or NAS directory names.
# No automatic mounting, root permissions, remote deletion or transfer is enabled by this file.

schema_version = 0

[interface]
theme = "system"

[[sources]]
id = "disk1"
label = "Disk 1"
local_root = "/mnt/archiv/disk1/data/media"
read_only = true

[[sources]]
id = "disk2"
label = "Disk 2"
local_root = "/mnt/archiv/disk2/data/media"
read_only = true

[[sources]]
id = "disk3"
label = "Disk 3"
local_root = "/mnt/archiv/disk3/data/media"
read_only = true

[[sources]]
id = "disk4"
label = "Disk 4"
local_root = "/mnt/archiv/disk4/data/media"
read_only = true

# Exact directory names; aliases are opt-in and do not rename anything on disk.
[[collections]]
id = "movies"
label = "Movies"
source_ids = ["disk1", "disk2", "disk3", "disk4"]
directory_names = ["movies", "movies remote"]

[[collections]]
id = "tv"
label = "TV"
source_ids = ["disk1", "disk2", "disk3", "disk4"]
directory_names = ["tv", "tv remote"]

[[collections]]
id = "anime"
label = "Anime"
source_ids = ["disk1", "disk2", "disk3", "disk4"]
directory_names = ["anime"]

[operations]
mutation_enabled = false
permanent_delete_enabled = false
# Future limits are examples, not an approved policy or an implemented guarantee.
max_selection = 1
unknown_size = "deny"
virtual_targets = "deny"
require_confirmation = true

[operations.protection]
# Source-relative structural paths. Deny deleting these targets, not every descendant.
paths = [".", "movies", "movies remote", "tv", "tv remote", "anime"]

# Recovery stores, byte limits, trusted mount identity, transport mappings and rule syntax must
# be designed/validated before mutation is enabled. Writable SSH capability is separate from
# read-only NFS and the app's source flags. Never place passwords or private keys in TOML.
